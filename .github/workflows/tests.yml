name: tests

on:
  push:
    branches: [main]
  pull_request:

# Once the repository is public anyone can open a pull request, and every job here
# only ever reads the checkout.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # aiohttp and cryptography are Home Assistant dependencies rather than ours,
      # but the tests import the api module directly, so they are needed here.
      - run: pip install pytest aiohttp cryptography ruff
      - run: python -m ruff check custom_components/ tests/ tests_ha/ scripts/
      - run: python -m ruff format --check custom_components/ tests/ tests_ha/ scripts/
      - run: python -m pytest tests/ -v

  config-flow-tests:
    # The Home Assistant test harness does not work on Windows, so these run only
    # here. Python 3.14 because pytest-homeassistant-custom-component 0.13.317 and
    # later require it: on 3.13 pip silently resolved 0.13.316 (Home Assistant
    # 2026.2.3) instead of the current release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The integration depends on bluetooth_adapters, so Home Assistant sets
      # that component up during these tests and needs its runtime stack
      # present. The harness does not pull these in on its own. serialx is the
      # serial layer the usb component imports since Home Assistant 2026.10 (its
      # manifest lists aiousbwatcher and serialx); without it importing
      # homeassistant.components.bluetooth fails at collection.
      #
      # The floor is the release this was written against (0.13.373, Home Assistant
      # 2026.10.2). If the Python version here ever stops satisfying the harness,
      # pip fails on it instead of quietly falling back to an old release.
      - run: >
          pip install "pytest-homeassistant-custom-component>=0.13.373"
          aiousbwatcher serialx pyserial usb-devices
          bluetooth-adapters habluetooth bleak bleak-retry-connector
      # So the version under test is visible in the log.
      - name: show the resolved Home Assistant versions
        run: |
          python --version
          pip list --format=freeze | grep -i -E '^(homeassistant|pytest-homeassistant-custom-component|voluptuous|bleak|habluetooth|bluetooth-adapters)=='
      # Run from inside tests_ha so its own pytest.ini applies. The root config
      # disables the Home Assistant plugin, which these tests require.
      - run: python -m pytest . -v
        working-directory: tests_ha

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit rather than @master so an upstream change cannot break
      # CI unannounced. This is master as of 2026-10-17; the repository has no
      # release tags worth following (its only tag is 1.0.0), so bump it by hand.
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master, 2026-10-17

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A commit on master, 15 commits past the 22.5.0 release (2026-06-08).
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # master, 2026-06-08
        with:
          category: integration
