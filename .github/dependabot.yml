version: 2
updates:
  # The integration itself has no Python dependencies (manifest requirements is
  # empty) and CI installs its test tools straight from the workflow rather than
  # from a requirements file, so there is no pip manifest for Dependabot to read.
  # The actions are what goes stale.
  #
  # hacs/action and home-assistant/actions/hassfest are pinned to a full commit
  # on their default branch rather than to a release tag. Dependabot follows
  # tags, so expect to refresh those two by hand; the comment beside each pin in
  # tests.yml says which commit it is.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
