[pytest]
# tests/ needs no Home Assistant and runs on any platform, Windows included.
#
# The Home Assistant plugin registers autouse fixtures for every test it can see,
# and those need a socketpair that pytest-socket blocks. Merely having the harness
# installed would otherwise break this suite, so both plugins are disabled here.
# The Home Assistant tests live in tests_ha/ with their own config - see its README.
testpaths = tests
pythonpath = .
addopts = -p no:homeassistant -p no:socket
